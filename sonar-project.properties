# SonarCloud Configuration for NodeCart

# Project identification
sonar.projectKey=nodecart
sonar.organization=your-organization

# Project metadata
sonar.projectName=NodeCart Microservices Platform
sonar.projectVersion=1.0.0

# Source code location
sonar.sources=shared/src,services/auth-service/src,services/user-service/src,services/product-service/src,services/order-service/src,services/payment-service/src,services/notification-service/src

# Test location
sonar.tests=shared/src/__tests__,services/auth-service/src/__tests__,services/user-service/src/__tests__,services/product-service/src/__tests__,services/order-service/src/__tests__,services/payment-service/src/__tests__,services/notification-service/src/__tests__

# Exclusions
sonar.exclusions=**/node_modules/**,**/coverage/**,**/dist/**,**/*.test.js,**/*.spec.js,infrastructure/**,scripts/**

# Test coverage
sonar.javascript.lcov.reportPaths=shared/coverage/lcov.info,services/auth-service/coverage/lcov.info,services/user-service/coverage/lcov.info,services/product-service/coverage/lcov.info,services/order-service/coverage/lcov.info,services/payment-service/coverage/lcov.info,services/notification-service/coverage/lcov.info

# Language
sonar.language=js

# Encoding
sonar.sourceEncoding=UTF-8

# Code smells
sonar.issue.ignore.multicriteria=e1,e2

# Ignore console.log in development files
sonar.issue.ignore.multicriteria.e1.ruleKey=javascript:S2228
sonar.issue.ignore.multicriteria.e1.resourceKey=**/logger.js

# Ignore TODO comments
sonar.issue.ignore.multicriteria.e2.ruleKey=javascript:S1135
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*
