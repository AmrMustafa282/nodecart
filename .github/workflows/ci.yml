name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    name: Build and Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Auth Service
        run: docker build -t nodecart-auth-service:test -f services/auth-service/Dockerfile .

      - name: Build User Service
        run: docker build -t nodecart-user-service:test -f services/user-service/Dockerfile .

      - name: Build Product Service
        run: docker build -t nodecart-product-service:test -f services/product-service/Dockerfile .

      - name: Build Order Service
        run: docker build -t nodecart-order-service:test -f services/order-service/Dockerfile .

      - name: Build Payment Service
        run: docker build -t nodecart-payment-service:test -f services/payment-service/Dockerfile .

      - name: Build Notification Service
        run: docker build -t nodecart-notification-service:test -f services/notification-service/Dockerfile .

      - name: Build API Gateway
        run: docker build -t nodecart-api-gateway:test -f api-gateway/Dockerfile .

      - name: Validate Docker Compose
        run: docker-compose config > /dev/null

      - name: Build summary
        run: |
          echo "✅ All Docker images built successfully"
          echo "✅ Docker Compose configuration is valid"
