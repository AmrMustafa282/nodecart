name: NodeCart CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '18'
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  # Job 1: Lint and Test Shared Library
  test-shared:
    name: Test Shared Library
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: shared/package-lock.json

      - name: Install dependencies
        working-directory: ./shared
        run: npm ci

      - name: Run linter
        working-directory: ./shared
        run: npm run lint || echo "Linting completed"

      - name: Run tests
        working-directory: ./shared
        run: npm test

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        if: always()
        with:
          files: ./shared/coverage/lcov.info
          flags: shared
          name: shared-library

  # Job 2: Test Auth Service
  test-auth:
    name: Test Auth Service
    runs-on: ubuntu-latest
    needs: test-shared

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install shared library
        working-directory: ./shared
        run: npm ci

      - name: Install service dependencies
        working-directory: ./services/auth-service
        run: npm ci

      - name: Run tests
        working-directory: ./services/auth-service
        run: npm test
        env:
          MONGODB_URI: mongodb://localhost:27017/auth_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-key
          JWT_REFRESH_SECRET: test-refresh-secret

  # Job 3: Test User Service
  test-user:
    name: Test User Service
    runs-on: ubuntu-latest
    needs: test-shared

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: user_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install shared library
        working-directory: ./shared
        run: npm ci

      - name: Install service dependencies
        working-directory: ./services/user-service
        run: npm ci

      - name: Run tests
        working-directory: ./services/user-service
        run: npm test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/user_test
          JWT_SECRET: test-secret-key

  # Job 4: Test Product Service
  test-product:
    name: Test Product Service
    runs-on: ubuntu-latest
    needs: test-shared

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install shared library
        working-directory: ./shared
        run: npm ci

      - name: Install service dependencies
        working-directory: ./services/product-service
        run: npm ci

      - name: Run tests
        working-directory: ./services/product-service
        run: npm test
        env:
          MONGODB_URI: mongodb://localhost:27017/product_test
          JWT_SECRET: test-secret-key

  # Job 5: Test Order Service
  test-order:
    name: Test Order Service
    runs-on: ubuntu-latest
    needs: test-shared

    services:
      mariadb:
        image: mariadb:11
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: order_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install shared library
        working-directory: ./shared
        run: npm ci

      - name: Install service dependencies
        working-directory: ./services/order-service
        run: npm ci

      - name: Run tests
        working-directory: ./services/order-service
        run: npm test
        env:
          DATABASE_URL: mysql://root:rootpassword@localhost:3306/order_test
          JWT_SECRET: test-secret-key

  # Job 6: Test Payment Service
  test-payment:
    name: Test Payment Service
    runs-on: ubuntu-latest
    needs: test-shared

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install shared library
        working-directory: ./shared
        run: npm ci

      - name: Install service dependencies
        working-directory: ./services/payment-service
        run: npm ci

      - name: Run tests
        working-directory: ./services/payment-service
        run: npm test
        env:
          MONGODB_URI: mongodb://localhost:27017/payment_test
          JWT_SECRET: test-secret-key

  # Job 7: Test Notification Service
  test-notification:
    name: Test Notification Service
    runs-on: ubuntu-latest
    needs: test-shared

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install shared library
        working-directory: ./shared
        run: npm ci

      - name: Install service dependencies
        working-directory: ./services/notification-service
        run: npm ci

      - name: Run tests
        working-directory: ./services/notification-service
        run: npm test
        env:
          MONGODB_URI: mongodb://localhost:27017/notification_test
          JWT_SECRET: test-secret-key

  # Job 8: Build Docker Images
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-auth, test-user, test-product, test-order, test-payment, test-notification]

    strategy:
      matrix:
        service:
          - auth-service
          - user-service
          - product-service
          - order-service
          - payment-service
          - notification-service
          - api-gateway

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/${{ matrix.service }}/Dockerfile
          push: false
          tags: nodecart-${{ matrix.service }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
        if: matrix.service != 'api-gateway'

      - name: Build API Gateway
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./api-gateway/Dockerfile
          push: false
          tags: nodecart-api-gateway:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
        if: matrix.service == 'api-gateway'

  # Job 9: Integration Tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build-images

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          cat > .env << EOF
          NODE_ENV=test
          JWT_SECRET=test-secret-key-for-ci
          JWT_REFRESH_SECRET=test-refresh-secret-key-for-ci
          MONGODB_URI=mongodb://mongodb:27017
          POSTGRES_URI=postgres://postgres:postgres@postgres:5432/user_db
          MARIADB_URI=mysql://root:rootpassword@mariadb:3306/order_db
          REDIS_URL=redis://redis:6379
          RABBITMQ_URL=amqp://rabbitmq:5672
          EOF

      - name: Start services
        run: |
          docker-compose up -d mongodb postgres mariadb redis rabbitmq
          sleep 20

      - name: Build and start microservices
        run: |
          docker-compose up -d --build auth-service user-service product-service order-service payment-service notification-service api-gateway
          sleep 30

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for services to be ready..."
          timeout=180
          elapsed=0

          while [ $elapsed -lt $timeout ]; do
            if docker-compose ps | grep -E "auth-service.*Up" && \
               docker-compose ps | grep -E "user-service.*Up" && \
               docker-compose ps | grep -E "product-service.*Up" && \
               docker-compose ps | grep -E "order-service.*Up" && \
               docker-compose ps | grep -E "payment-service.*Up" && \
               docker-compose ps | grep -E "notification-service.*Up"; then
              echo "All services are up!"
              break
            fi
            echo "Waiting for services... ($elapsed seconds elapsed)"
            sleep 5
            elapsed=$((elapsed + 5))
          done

          if [ $elapsed -ge $timeout ]; then
            echo "Timeout waiting for services"
            docker-compose logs
            exit 1
          fi

      - name: Run health checks
        run: |
          chmod +x ./scripts/health-check.sh
          ./scripts/health-check.sh || true

      - name: Test API Gateway
        run: |
          echo "Testing API Gateway..."
          curl -f http://localhost:3000/health || exit 1
          echo "✅ API Gateway health check passed"

      - name: Test Auth Service
        run: |
          echo "Testing Auth Service..."
          response=$(curl -s -X POST http://localhost:3000/api/auth/register \
            -H "Content-Type: application/json" \
            -d '{
              "name": "CI Test User",
              "email": "ci-test@example.com",
              "password": "Test@1234",
              "role": "user"
            }')
          echo "$response"
          echo "$response" | grep -q "success" || exit 1
          echo "✅ Auth Service test passed"

      - name: Test Product Service
        run: |
          echo "Testing Product Service..."
          curl -f http://localhost:3000/api/products?page=1&limit=10 || exit 1
          echo "✅ Product Service test passed"

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== Docker Compose Services ==="
          docker-compose ps
          echo "=== Auth Service Logs ==="
          docker-compose logs auth-service
          echo "=== User Service Logs ==="
          docker-compose logs user-service
          echo "=== Product Service Logs ==="
          docker-compose logs product-service

      - name: Cleanup
        if: always()
        run: docker-compose down -v

  # Job 10: Security Scan
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test-shared

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # Job 11: Code Quality
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          cd shared && npm ci && cd ..
          cd services/auth-service && npm ci && cd ../..

      - name: Run ESLint
        run: |
          cd shared && npm run lint || echo "Linting completed" && cd ..

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        continue-on-error: true

  # Job 12: Deployment (only on main branch)
  deploy:
    name: Deploy to Registry
    runs-on: ubuntu-latest
    needs: [integration-tests, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        if: secrets.DOCKER_USERNAME != ''

      - name: Build and push images
        run: |
          services=("auth-service" "user-service" "product-service" "order-service" "payment-service" "notification-service")

          for service in "${services[@]}"; do
            echo "Building and pushing $service..."
            docker build -t ${{ secrets.DOCKER_USERNAME }}/nodecart-$service:latest \
              -t ${{ secrets.DOCKER_USERNAME }}/nodecart-$service:${{ github.sha }} \
              -f services/$service/Dockerfile .

            docker push ${{ secrets.DOCKER_USERNAME }}/nodecart-$service:latest || echo "Push to Docker Hub skipped"
            docker push ${{ secrets.DOCKER_USERNAME }}/nodecart-$service:${{ github.sha }} || echo "Push to Docker Hub skipped"
          done
        if: secrets.DOCKER_USERNAME != ''

      - name: Deploy notification
        run: |
          echo "✅ Build and tests passed!"
          echo "📦 Images tagged with: ${{ github.sha }}"
          echo "🚀 Ready for deployment!"
