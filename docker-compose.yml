version: '3.8'

services:
  # ===================
  # Infrastructure Services
  # ===================

  # API Gateway (NGINX)
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: nodecart-api-gateway
    ports:
      - "3000:3000"
    networks:
      - nodecart-network
    depends_on:
      - auth-service
      - user-service
      - product-service
      - order-service
      - payment-service
      - notification-service
    restart: unless-stopped

  # Redis
  redis:
    image: redis:7-alpine
    container_name: nodecart-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - nodecart-network
    restart: unless-stopped
    command: redis-server --appendonly yes

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: nodecart-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - nodecart-network
    restart: unless-stopped
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 3

  # MongoDB
  mongodb:
    image: mongo:7
    container_name: nodecart-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: nodecart
    volumes:
      - mongodb-data:/data/db
    networks:
      - nodecart-network
    restart: unless-stopped
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: nodecart-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: user_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - nodecart-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MariaDB
  mariadb:
    image: mariadb:11
    container_name: nodecart-mariadb
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: order_db
    volumes:
      - mariadb-data:/var/lib/mysql
    networks:
      - nodecart-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MinIO (S3-compatible storage)
  minio:
    image: minio/minio:latest
    container_name: nodecart-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    networks:
      - nodecart-network
    command: server /data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Mailhog (Email testing)
  mailhog:
    image: mailhog/mailhog:latest
    container_name: nodecart-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - nodecart-network
    restart: unless-stopped

  # Elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: nodecart-elasticsearch
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - nodecart-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Logstash
  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.0
    container_name: nodecart-logstash
    ports:
      - "5000:5000"
      - "9600:9600"
    environment:
      - "LS_JAVA_OPTS=-Xms256m -Xmx256m"
    volumes:
      - ./infrastructure/logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
      - ./infrastructure/logstash/logstash.yml:/usr/share/logstash/config/logstash.yml
    networks:
      - nodecart-network
    depends_on:
      - elasticsearch
    restart: unless-stopped

  # Kibana
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: nodecart-kibana
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    networks:
      - nodecart-network
    depends_on:
      - elasticsearch
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: nodecart-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - nodecart-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped

  # Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: nodecart-grafana
    ports:
      - "3030:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: redis-datasource
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - nodecart-network
    depends_on:
      - prometheus
    restart: unless-stopped

  # ===================
  # Microservices
  # ===================

  # Auth Service
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: nodecart-auth-service
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      SERVICE_NAME: auth-service
      MONGODB_URI: mongodb://mongodb:27017/auth_db
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://rabbitmq:5672
      JWT_SECRET: your-secret-key-change-in-production
      JWT_REFRESH_SECRET: your-refresh-secret-key-change-in-production
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ENABLE_ELK: "true"
    networks:
      - nodecart-network
    depends_on:
      - mongodb
      - redis
      - rabbitmq
      - elasticsearch
    restart: unless-stopped

  # User Service
  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    container_name: nodecart-user-service
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: development
      PORT: 3002
      SERVICE_NAME: user-service
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: user_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://rabbitmq:5672
      JWT_SECRET: your-secret-key-change-in-production
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ENABLE_ELK: "true"
    networks:
      - nodecart-network
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - elasticsearch
    restart: unless-stopped

  # Product Service
  product-service:
    build:
      context: .
      dockerfile: services/product-service/Dockerfile
    container_name: nodecart-product-service
    ports:
      - "3003:3003"
    environment:
      NODE_ENV: development
      PORT: 3003
      SERVICE_NAME: product-service
      MONGODB_URI: mongodb://mongodb:27017/product_db
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://rabbitmq:5672
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_USE_SSL: "false"
      MINIO_BUCKET: products
      JWT_SECRET: your-secret-key-change-in-production
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ENABLE_ELK: "true"
    networks:
      - nodecart-network
    depends_on:
      - mongodb
      - redis
      - rabbitmq
      - minio
      - elasticsearch
    restart: unless-stopped

  # Order Service
  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    container_name: nodecart-order-service
    ports:
      - "3004:3004"
    environment:
      NODE_ENV: development
      PORT: 3004
      SERVICE_NAME: order-service
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: order_db
      DB_USER: root
      DB_PASSWORD: rootpassword
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://rabbitmq:5672
      JWT_SECRET: your-secret-key-change-in-production
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ENABLE_ELK: "true"
    networks:
      - nodecart-network
    depends_on:
      - mariadb
      - redis
      - rabbitmq
      - elasticsearch
    restart: unless-stopped

  # Payment Service
  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    container_name: nodecart-payment-service
    ports:
      - "3005:3005"
    environment:
      NODE_ENV: development
      PORT: 3005
      SERVICE_NAME: payment-service
      MONGODB_URI: mongodb://mongodb:27017/payment_db
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://rabbitmq:5672
      JWT_SECRET: your-secret-key-change-in-production
      PAYMENT_SUCCESS_RATE: "0.9"
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ENABLE_ELK: "true"
    networks:
      - nodecart-network
    depends_on:
      - mongodb
      - redis
      - rabbitmq
      - elasticsearch
    restart: unless-stopped

  # Notification Service
  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: nodecart-notification-service
    ports:
      - "3006:3006"
    environment:
      NODE_ENV: development
      PORT: 3006
      SERVICE_NAME: notification-service
      MONGODB_URI: mongodb://mongodb:27017/notification_db
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://rabbitmq:5672
      EMAIL_HOST: mailhog
      EMAIL_PORT: 1025
      EMAIL_FROM: noreply@nodecart.com
      EMAIL_FROM_NAME: NodeCart
      JWT_SECRET: your-secret-key-change-in-production
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ENABLE_ELK: "true"
    networks:
      - nodecart-network
    depends_on:
      - mongodb
      - redis
      - rabbitmq
      - mailhog
      - elasticsearch
    restart: unless-stopped

networks:
  nodecart-network:
    driver: bridge

volumes:
  redis-data:
  rabbitmq-data:
  mongodb-data:
  postgres-data:
  mariadb-data:
  minio-data:
  elasticsearch-data:
  prometheus-data:
  grafana-data:
